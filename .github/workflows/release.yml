name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libelf-dev zlib1g-dev pkg-config
      
      - name: Build veilctl
        run: cargo build -p veilctl --release
      
      - name: Build veilnetd
        run: cargo build -p veilnetd --release
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/veilctl
            target/release/veilnetd
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}