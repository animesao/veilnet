[workspace]
resolver = "2"
members = ["src", "cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["veilnet contributors"]
repository = "https://github.com/yourusername/veilnet"
homepage = "https://github.com/yourusername/veilnet"
description = "TC + eBPF based DPI bypass for Linux"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
libbpf-rs = "0.24"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.40", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"
